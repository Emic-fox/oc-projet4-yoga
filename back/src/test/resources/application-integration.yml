# Profil dédié aux tests d'intégration des controllers avec H2
oc:
  app:
    jwtExpirationMs: 86400000
    # Secret Base64 (>= 256 bits une fois décodé) propre aux tests.
    jwtSecret: dGVzdC1zZWNyZXQtcG91ci1sZXMtdGVzdHMtZC1pbnRlZ3JhdGlvbi1kb2l0LWV0cmUtYXNzZXotbG9uZy0yNTZiaXRz
spring:
  datasource:
    url: jdbc:h2:mem:integration;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  sql:
    init:
      mode: never
logging:
  level:
    org:
      hibernate: warn
