<div class="my-4 flex flex-row justify-between items-center">
  @if (createdAt) {
    <div data-testid="created-at"><i>Create at: </i>{{ createdAt | date: 'longDate' }}</div>
  }
  @if (updatedAt) {
    <div data-testid="updated-at"><i>Last update: </i>{{ updatedAt | date: 'longDate' }}</div>
  }
</div>
