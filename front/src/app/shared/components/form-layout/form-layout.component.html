<div class="m-8" fxLayout="row" fxLayoutAlign="center center">
  <mat-card class="m-5 w-full" [style.max-width]="maxWidth">
    <mat-card-header fxLayoutAlign="center center">
      @if (title) {
        <mat-card-title>{{ title }}</mat-card-title>
      } @else {
        <ng-content select="[layout-title]"></ng-content>
      }
    </mat-card-header>
    
    <mat-card-content>
      <ng-content></ng-content>
    </mat-card-content>
  </mat-card>
</div>
