<div class="list">
  <mat-card>
    <mat-card-header fxLayout="row" fxLayoutAlign="space-between center">
      <mat-card-title class="m0">Rentals available</mat-card-title>
      @if (user!.admin) {
        <app-icon-button icon="add" label="Create" routerLink="create" />
      }
    </mat-card-header>
    <div class="items mt2" fxLayout="row wrap" fxLayout.lt-md="column">
      @for (session of (sessions$ | async); track session.id) {
        <mat-card class="item" fxFlex>
          <mat-card-header>
            <mat-card-title>{{ session.name }}</mat-card-title>
            <mat-card-subtitle>
              Session on {{ session.date | date: 'longDate'}}
            </mat-card-subtitle>
          </mat-card-header>
          <div mat-card-image fxLayoutAlign="center center">
            <app-session-image />
          </div>
          <mat-card-content>
            <p>
              {{ session.description }}
            </p>
          </mat-card-content>
          <mat-card-actions>
            <app-icon-button icon="search" label="Detail" [routerLink]="['detail', session.id]" />
            @if (user!.admin) {
              <app-icon-button icon="edit" label="Edit" [routerLink]="['update', session.id]" />
            }
          </mat-card-actions>
        </mat-card>
      }
    </div>
  </mat-card>
</div>
