<div class="m-8">
  @if (session) {
    <mat-card>
      <mat-card-title>
        <div class="flex flex-row justify-between items-center">
          <app-page-title [title]="session.name | titlecase" />
          <div>
            @if (isAdmin) {
              <app-icon-button data-testid="delete-session-button" icon="delete" label="Delete" color="warn" (buttonClick)="delete()" />
            } @else {
              <div>
                @if (isParticipate) {
                  <app-icon-button data-testid="unparticipate-button" icon="person_remove" label="Do not participate" color="warn" (buttonClick)="unParticipate()" />
                } @else {
                  <app-icon-button data-testid="participate-button" icon="person_add" label="Participate" (buttonClick)="participate()" />
                }
              </div>
            }
          </div>
        </div>
      </mat-card-title>

      @if (teacher) {
        <mat-card-subtitle>
          <div class="ml-8 flex justify-start items-center">
            <mat-icon>
              people
            </mat-icon>
            <span data-testid="teacher-name" class="ml-2">{{ teacher.firstName }} {{ teacher.lastName | uppercase }}</span>
          </div>
        </mat-card-subtitle>
      }

      <div mat-card-image class="flex justify-center items-center">
        <app-session-image />
      </div>

      <mat-card-content>
        <div class="my-4 flex flex-row justify-between items-center">
          <div class="flex justify-start items-center">
            <mat-icon>
              group
            </mat-icon>
            <span data-testid="attendees-count" class="ml-2">{{ session.users.length }} attendees</span>
          </div>
          <div class="flex justify-start items-center">
            <mat-icon>
              calendar_month
            </mat-icon>
            <span class="ml-2">{{ session.date | date: 'longDate'}}</span>
          </div>
        </div>
        <div class="description" data-testid="session-description">
          <p>Description:</p>
          {{ session.description }}
          <br>
        </div>
        <app-record-dates [createdAt]="session.createdAt" [updatedAt]="session.updatedAt" />
      </mat-card-content>
    </mat-card>
  }
</div>
